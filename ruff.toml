line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "UP"]
ignore = ["E501", "E741", "E402", "W293"]
# Assume Python 3.13
target-version = "py313"

exclude = [
]

[per-file-ignores]

[mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[pydocstyle]
convention = "numpy"
